<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmiGo Web — Real-Time EMI Sync</title>
  <style>
    :root {
      --bg: #090d18;
      --card: rgba(20, 27, 45, 0.88);
      --border: #283554;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #8ab4f8;
      --success: #34d399;
      --danger: #fb7185;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 10%, rgba(66, 133, 244, 0.24), transparent 45%),
        radial-gradient(circle at 88% 22%, rgba(155, 114, 203, 0.22), transparent 42%),
        radial-gradient(circle at 20% 70%, rgba(217, 101, 112, 0.16), transparent 45%),
        var(--bg);
      padding: 24px 16px;
    }
    .container { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    h1, h2, h3 { margin: 0 0 8px; }
    p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
    input, button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
    }
    input { background: #0f1628; color: var(--text); width: 100%; margin-bottom: 10px; }
    button {
      background: var(--accent);
      color: #091224;
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    button.secondary { background: #1e2949; color: var(--text); border: 1px solid var(--border); }
    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 8px;
      background: #1a233a; border: 1px solid var(--border);
      font-size: 12px; cursor: pointer;
    }
    .chip.paid { background: #0f2d27; border-color: #1b5e4e; color: var(--success); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .hidden { display: none; }
    .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card row">
      <div>
        <h1>EmiGo Web</h1>
        <p style="margin:0">Real-time sync with your Android EmiGo app via registered mobile number</p>
      </div>
      <button id="signOutBtn" class="secondary hidden">Sign Out</button>
    </div>

    <div id="authCard" class="card">
      <h2>Sign In with Mobile Number</h2>
      <p>Enter the same registered mobile number linked in your Android EmiGo app.</p>
      <input id="phoneInput" type="tel" placeholder="+919876543210" />
      <div id="recaptcha-container"></div>
      <button id="sendOtpBtn">Send OTP</button>

      <div id="otpBox" class="hidden" style="margin-top:14px">
        <input id="otpInput" type="text" maxlength="6" placeholder="Enter 6-digit SMS OTP" />
        <button id="verifyOtpBtn">Verify &amp; Sync</button>
      </div>
      <div id="authError" class="err"></div>
    </div>

    <div id="dashCard" class="hidden">
      <div class="card" style="margin-bottom:16px">
        <div class="row">
          <div>
            <h2 id="phoneLabel">Synced</h2>
            <p id="summaryLabel" style="margin:0">Loading loans...</p>
          </div>
          <span style="color:var(--success);font-weight:700;font-size:13px">● Live Sync</span>
        </div>
      </div>
      <div id="loansList" class="container"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // Replace with your Firebase Web App config from Firebase Console
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      appId: "YOUR_WEB_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const authCard = document.getElementById("authCard");
    const dashCard = document.getElementById("dashCard");
    const signOutBtn = document.getElementById("signOutBtn");
    const phoneInput = document.getElementById("phoneInput");
    const otpInput = document.getElementById("otpInput");
    const otpBox = document.getElementById("otpBox");
    const authError = document.getElementById("authError");
    const loansList = document.getElementById("loansList");

    let confirmationResult = null;
    let currentLoans = [];
    let currentCurrency = "INR";
    let unsub = null;

    window.recaptchaVerifier = new RecaptchaVerifier(auth, "recaptcha-container", { size: "invisible" });

    document.getElementById("sendOtpBtn").onclick = async () => {
      authError.textContent = "";
      try {
        confirmationResult = await signInWithPhoneNumber(auth, phoneInput.value.trim(), window.recaptchaVerifier);
        otpBox.classList.remove("hidden");
      } catch (e) {
        authError.textContent = e.message;
      }
    };

    document.getElementById("verifyOtpBtn").onclick = async () => {
      authError.textContent = "";
      try {
        await confirmationResult.confirm(otpInput.value.trim());
      } catch (e) {
        authError.textContent = e.message;
      }
    };

    signOutBtn.onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (!user) {
        authCard.classList.remove("hidden");
        dashCard.classList.add("hidden");
        signOutBtn.classList.add("hidden");
        return;
      }
      authCard.classList.add("hidden");
      dashCard.classList.remove("hidden");
      signOutBtn.classList.remove("hidden");
      document.getElementById("phoneLabel").textContent = user.phoneNumber || "Synced Account";

      const stateRef = doc(db, "users", user.uid, "vault", "state");
      unsub = onSnapshot(stateRef, (snap) => {
        if (!snap.exists()) {
          currentLoans = [];
          render(user);
          return;
        }
        const data = snap.data();
        currentCurrency = data.currency || "INR";
        currentLoans = JSON.parse(data.loansJson || "[]");
        render(user);
      });
    });

    function render(user) {
      const sym = currentCurrency === "USD" ? "$" : "₹";
      let left = 0;
      currentLoans.forEach(l => Object.values(l.payments || {}).forEach(p => {
        if (p.status !== "PAID") left += Number(p.amount || 0);
      }));
      document.getElementById("summaryLabel").textContent = `${currentLoans.length} account(s) · Remaining: ${sym}${left.toLocaleString()}`;
      loansList.innerHTML = "";
      currentLoans.forEach((loan, idx) => {
        const div = document.createElement("div");
        div.className = "card";
        const chips = Object.entries(loan.payments || {}).sort(([a], [b]) => a.localeCompare(b)).map(([k, p]) =>
          `<span class="chip ${p.status === "PAID" ? "paid" : ""}" data-idx="${idx}" data-key="${k}">${k}: ${sym}${p.amount} ${p.status === "PAID" ? "✓" : ""}</span>`
        ).join("");
        div.innerHTML = `<h3>${loan.platform}</h3><p>Due day: ${loan.dueDay || "-"}</p><div class="chips">${chips}</div>`;
        loansList.appendChild(div);
      });

      loansList.querySelectorAll(".chip").forEach(el => {
        el.onclick = async () => {
          const i = Number(el.dataset.idx);
          const k = el.dataset.key;
          const p = currentLoans[i].payments[k];
          p.status = p.status === "PAID" ? "UPCOMING" : "PAID";
          await setDoc(doc(db, "users", user.uid, "vault", "state"), {
            loansJson: JSON.stringify(currentLoans),
            currency: currentCurrency,
            updatedAtMs: Date.now(),
            phone: user.phoneNumber || ""
          });
        };
      });
    }
  </script>
</body>
</html>
